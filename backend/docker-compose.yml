# Local PostgreSQL for development and tests. Credentials match
# AgainBuy.Api/appsettings.Development.json; never use them in production.
services:
  postgres:
    image: postgres:17-alpine
    container_name: againbuy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: againbuy
      POSTGRES_USER: againbuy
      POSTGRES_PASSWORD: againbuy_dev
    ports:
      - "5432:5432"
    volumes:
      - againbuy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U againbuy -d againbuy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  againbuy-pgdata:
